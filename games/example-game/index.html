<!doctype html>
<html>
<head><meta charset="utf-8"><title>Example Game</title>
<style>body{margin:0;background:#111;display:flex;align-items:center;justify-content:center;height:100vh;color:#fff;font-family:sans-serif}canvas{background:#1d2230;border-radius:8px}</style>
</head>
<body>
<canvas id="c" width="480" height="320"></canvas>
<script>
// Click the dot to score.
const c = document.getElementById('c'), x = c.getContext('2d');
let dot = {x:240, y:160, r:20}, score = 0;
function draw() {
  x.clearRect(0,0,480,320);
  x.fillStyle = '#6c8cff'; x.beginPath(); x.arc(dot.x,dot.y,dot.r,0,Math.PI*2); x.fill();
  x.fillStyle = '#fff'; x.font = '18px sans-serif'; x.fillText('Score: ' + score, 12, 26);
}
c.onclick = e => {
  const b = c.getBoundingClientRect();
  if (Math.hypot(e.clientX-b.left-dot.x, e.clientY-b.top-dot.y) < dot.r) {
    score++; dot.x = 30 + Math.random()*420; dot.y = 40 + Math.random()*250;
  }
  draw();
};
draw();
</script>
</body>
</html>
